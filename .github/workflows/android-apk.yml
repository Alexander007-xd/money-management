name: Android APK

# Builds the signed release APK. It never touches the gh-pages branch, so the
# GitHub Pages deploy keeps working.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taka-khata
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: vitest 5 needs ^22.12.0 and jsdom 30 needs
      # ^22.22.2 || ^24.15.0 || >=26, so Node 20 cannot run the suite.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: taka-khata/package-lock.json

      # Capacitor 7 Android compiles with Java 21
      # (android/app/capacitor.build.gradle sets VERSION_21) and Gradle 8.11
      # supports 21, so the JDK here must be exactly 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: npm ci
      - run: npm test
      - run: npm run build:android
      - run: npx cap sync android

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TAKAKHATA_STORE_PASSWORD: ${{ secrets.TAKAKHATA_STORE_PASSWORD }}
          TAKAKHATA_KEY_ALIAS: ${{ secrets.TAKAKHATA_KEY_ALIAS }}
          TAKAKHATA_KEY_PASSWORD: ${{ secrets.TAKAKHATA_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 TAKAKHATA_STORE_PASSWORD TAKAKHATA_KEY_ALIAS TAKAKHATA_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/takakhata.keystore

      - name: Build signed release APK
        working-directory: taka-khata/android
        env:
          TAKAKHATA_STORE_PASSWORD: ${{ secrets.TAKAKHATA_STORE_PASSWORD }}
          TAKAKHATA_KEY_ALIAS: ${{ secrets.TAKAKHATA_KEY_ALIAS }}
          TAKAKHATA_KEY_PASSWORD: ${{ secrets.TAKAKHATA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: taka-khata-apk
          path: taka-khata/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: taka-khata/android/app/build/outputs/apk/release/app-release.apk
